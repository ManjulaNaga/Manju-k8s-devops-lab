apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
  - target:
      kind: Ingress
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.dev.localtest.me
  - target:
      kind: HorizontalPodAutoscaler
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
